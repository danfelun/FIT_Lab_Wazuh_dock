services:
  victim01:
    build:
      context: ./victim
    container_name: victim01
    hostname: victim01
    restart: unless-stopped
    environment:
      WAZUH_MANAGER: wazuh.manager
      WAZUH_AGENT_NAME: victim01
      TZ: America/Bogota
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    

  attacker01:
    build:
      context: ./attacker
    container_name: attacker01
    hostname: attacker01
    restart: unless-stopped
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]
    environment:
      TZ: America/Bogota
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro